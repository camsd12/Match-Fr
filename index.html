<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070b17">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Match FR">

  <title>Match FR</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css?v=4">
</head>

<body>

<header>
  <h1>Match FR</h1>
  <button id="refresh">↻</button>
</header>

<div class="tabs">
  <button id="footBtn" class="active">⚽ Foot</button>
  <button id="nbaBtn">🏀 NBA</button>
</div>

<main>

  <section class="hero">
    <small>PROGRAMME SPORTIF</small>
    <h2>Les matchs à l'heure française 🇫🇷</h2>
    <p>Calendrier et diffuseurs • mise à jour automatique</p>
  </section>

  <!-- FOOT -->
  <section id="foot-section">
    <div class="status">
      <span class="dot"></span>
      <span id="updated">Chargement...</span>
    </div>

    <section id="matches"></section>
  </section>

  <!-- NBA -->
  <section id="nba-section" style="visibility:hidden; position:absolute; left:-9999px;">
    <h2>📺 Programme TV NBA</h2>

    <a
      class="tvsports-widget"
      href="https://tv-sports.fr/basket/nba"
      data-widget="programme"
      data-target-type="competition"
      data-target-id="149"
      data-direct-only="0"
      data-limit="20"
      data-theme="dark">
      Programme TV NBA
    </a>
  </section>

</main>

<nav>
  <span>🏠<small>Aujourd'hui</small></span>
  <span>🏆<small>Compétitions</small></span>
  <span>⭐<small>Favoris</small></span>
</nav>

<script async src="https://tv-sports.fr/widget.js"></script>
<script src="./app.js?v=4"></script>

</body>
</html>
